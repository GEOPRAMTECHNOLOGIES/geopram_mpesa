<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEOPRAM Services M-Pesa Payment</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f4f7fb; color: #1b2733; }
    .container { max-width: 640px; margin: auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 10px 32px rgba(0,0,0,.08); }
    h1, h2 { margin-top: 0; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { margin-top: 18px; padding: 14px 20px; border: none; border-radius: 8px; background: #0062cc; color: white; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #7f9cf5; cursor: default; }
    .status { margin-top: 18px; padding: 18px; border-radius: 12px; background: #f8fafc; border: 1px solid #cbd5e1; }
    .success { color: #065f46; }
    .fail { color: #b91c1c; }
    .info { color: #1d4ed8; }
    .note { margin-top: 14px; font-size: 0.95rem; color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GEOPRAM Services Payment</h1>
    <p>Pay using M-Pesa STK Push to Till <strong>8112723</strong> via Short Code <strong>4574727</strong>.</p>
    <form id="payment-form">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required />

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" name="phone" placeholder="2547XXXXXXXX" required />

      <label for="amount">Amount (KES)</label>
      <input type="number" id="amount" name="amount" min="1" step="1" required />

      <button type="submit">Pay with M-Pesa</button>
    </form>

    <div id="status" class="status" style="display:none"></div>
    <div class="note">
      After you submit, Safaricom will send a callback to the server. The page polls for the payment result and shows a success message when complete.
    </div>
  </div>
  <script src="/payment.js"></script>
</body>
</html>
