<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEOPRAM Services — M-Pesa Payment</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #f4f7fb;
      color: #1b2733;
      min-height: 100vh;
    }
    .container {
      max-width: 560px;
      margin: auto;
      background: #fff;
      padding: 32px 28px;
      border-radius: 14px;
      box-shadow: 0 10px 32px rgba(0,0,0,.08);
    }
    .logo { font-size: 1.3rem; font-weight: 700; color: #0f766e; margin-bottom: 4px; }
    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    p  { margin: 0 0 20px; color: #475569; font-size: 0.95rem; }
    label { display: block; margin: 14px 0 5px; font-weight: 600; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color .2s;
    }
    input:focus { outline: none; border-color: #0f766e; }
    button[type="submit"] {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0f766e;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button[type="submit"]:hover:not(:disabled) { background: #0d6460; }
    button[type="submit"]:disabled { background: #94a3b8; cursor: default; }
    .status-box {
      display: none;
      margin-top: 20px;
      padding: 16px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .status-info    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
    .status-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .status-fail    { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .note { margin-top: 18px; font-size: 0.85rem; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 14px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #bfdbfe; border-top-color: #1d4ed8; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">GEOPRAM Technologies</div>
    <h1>M-Pesa Payment</h1>
    <p>Pay via STK Push — Short Code <strong>4574727</strong> / Till <strong>8112723</strong>.</p>

    <form id="payment-form" novalidate>
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="jane@example.com" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="0712345678 or 254712345678" required />

      <label for="amount">Amount (KES)</label>
      <input type="number" id="amount" name="amount" min="1" step="1" placeholder="100" required />

      <button type="submit" id="pay-btn">Pay with M-Pesa</button>
    </form>

    <div id="status-box" class="status-box"></div>

    <p class="note">After submitting, a prompt will appear on your phone. Enter your M-Pesa PIN to complete payment. This page will update automatically.</p>
  </div>
  <script src="/payment.js"></script>
</body>
</html>
