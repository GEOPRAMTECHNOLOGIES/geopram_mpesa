<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEOPRAM Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eff2f7; color: #1f2937; margin: 0; padding: 24px; }
    .container { max-width: 1040px; margin: auto; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 12px 32px rgba(15,23,42,.08); }
    h1, h2 { margin-top: 0; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; }
    button { margin-top: 14px; padding: 12px 18px; border: none; background: #0f766e; color: white; border-radius: 10px; cursor: pointer; }
    button.secondary { background: #334155; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; background: #f8fafc; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; }
    .status-success { color: #166534; font-weight: 700; }
    .status-failed { color: #b91c1c; font-weight: 700; }
    .login-box { max-width: 420px; margin: auto; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-screen" class="login-box">
      <h1>Admin Login</h1>
      <form id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
        <button type="submit">Sign In</button>
      </form>
      <div id="login-message" style="margin-top: 14px; color: #b91c1c;"></div>
    </div>

    <div id="dashboard" class="hidden">
      <h1>GEOPRAM M-Pesa Dashboard</h1>
      <div class="grid">
        <div class="card"><h2>Summary</h2><p id="summary"></p></div>
        <div class="card"><h2>Actions</h2><button id="logout">Logout</button> <button id="export-csv" class="secondary">Export CSV</button></div>
      </div>

      <div style="margin-top: 24px; display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end;">
        <div style="flex:1; min-width:240px;"><label>Search</label><input type="text" id="search" placeholder="Name, email or phone" /></div>
        <div style="width:180px;"><label>Status</label><select id="filter-status"><option value="">All</option><option value="SUCCESS">Success</option><option value="FAILED">Failed</option><option value="PENDING">Pending</option></select></div>
        <div><button id="load-transactions">Load Records</button></div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Phone</th>
            <th>Amount</th>
            <th>Receipt</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="transaction-table"></tbody>
      </table>
      <div id="dashboard-message" style="margin-top:16px;color:#1d4ed8;"></div>
    </div>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
